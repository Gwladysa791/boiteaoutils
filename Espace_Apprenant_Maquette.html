<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace apprenant — Maquette d'interface — AXIS MUNDI</title>
<style>
  @font-face {
    font-family: 'Century Gothic Fallback';
    src: local('Century Gothic'), local('CenturyGothic');
  }
  :root{
    --bleu: #00B5E2;
    --bleu-fonce: #0088A9;
    --gris-clair: #D7D3CE;
    --gris: #5D6160;
    --gris-moyen: #A2A5A4;
    --fond: #F0EBE5;
    --gris-fond2: #ECEDED;
    --vert: #15CA88;
    --orange: #F5AB33;
    --rouge: #DE5C5C;
    --violet: #884EC2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Century Gothic Fallback','Century Gothic',Futura,'Trebuchet MS',sans-serif;
    background:var(--fond);
    color:var(--gris);
    line-height:1.55;
    padding-bottom:64px;
  }
  button, input, textarea, select{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Bandeau maquette ---------- */
  .demo-bar{position:sticky;top:0;z-index:200;background:#20282b;color:#fff;display:flex;align-items:center;gap:14px;padding:9px 18px;flex-wrap:wrap;}
  .demo-bar .demo-tag{background:var(--orange);color:#20282b;font-weight:800;font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:4px 10px;border-radius:20px;flex-shrink:0;}
  .demo-bar .demo-note{font-size:12px;color:#C9CDCC;flex:1;min-width:220px;}
  .demo-bar .back-link{font-size:12px;font-weight:700;color:#fff;text-decoration:none;flex-shrink:0;}
  .demo-bar .back-link:hover{text-decoration:underline;}

  /* ---------- Écran participant ---------- */
  .app-wrap{max-width:440px;margin:34px auto 40px;padding:0 18px;}
  .app-card{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(20,30,35,0.10);padding:28px 26px 30px;}

  .join-card{text-align:center;}
  .app-logo{height:26px;display:block;margin:0 auto 22px;}
  .join-card h1{margin:0 0 8px;font-size:19px;color:#20282b;}
  .join-sub{margin:0 0 22px;font-size:13px;color:var(--gris);}
  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--gris);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
  .field input{width:100%;border:1.5px solid var(--gris-clair);border-radius:10px;padding:11px 13px;font-size:14px;color:#20282b;}
  .field input:focus{outline:none;border-color:var(--bleu);}
  .join-error{display:none;color:var(--rouge);font-size:12px;font-weight:700;margin:-6px 0 12px;text-align:left;}
  .btn-join{width:100%;background:var(--bleu-fonce);color:#fff;border:none;padding:13px;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;margin-top:4px;}
  .btn-join:hover{background:#00708a;}
  .join-note{font-size:11.5px;color:var(--gris-moyen);margin:16px 0 0;}

  .lobby-card{text-align:center;}
  .lobby-pulse{width:54px;height:54px;margin:4px auto 20px;position:relative;}
  .lobby-pulse span{position:absolute;inset:0;border-radius:50%;background:var(--bleu);opacity:.28;animation:lobbyPulse 1.8s ease-out infinite;}
  .lobby-pulse::after{content:'';position:absolute;inset:16px;border-radius:50%;background:var(--bleu-fonce);}
  @keyframes lobbyPulse{0%{transform:scale(.55);opacity:.55;}100%{transform:scale(1.7);opacity:0;}}
  .lobby-card h2{margin:0 0 10px;font-size:18px;color:#20282b;}
  .lobby-card p{margin:0 auto;max-width:320px;font-size:13px;color:var(--gris);}
  .lobby-count{margin-top:20px;font-size:12.5px;font-weight:700;color:#20282b;background:var(--gris-fond2);border-radius:20px;padding:8px 16px;display:inline-flex;align-items:center;gap:6px;}

  .app-topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--gris-clair);}
  .app-topbar-session strong{display:block;font-size:13.5px;color:#20282b;line-height:1.3;}
  .app-topbar-session span{font-size:11px;color:var(--gris-moyen);}
  .app-topbar-you{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#20282b;flex-shrink:0;white-space:nowrap;}
  .app-topbar-you .avatar{width:26px;height:26px;border-radius:50%;background:var(--bleu-fonce);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0;}
  .app-activity-tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--bleu-fonce);background:#EAF7FB;padding:4px 10px;border-radius:10px;margin-bottom:16px;}

  .act-diapo h2{margin:0 0 12px;font-size:18px;color:#20282b;line-height:1.35;}
  .act-diapo p{margin:0 0 18px;font-size:13.5px;color:var(--gris);}
  .act-hint{display:flex;align-items:center;gap:9px;background:var(--gris-fond2);border-radius:10px;padding:11px 14px;font-size:12px;color:var(--gris-moyen);}

  .act-sondage h2{margin:0 0 16px;font-size:15px;color:#20282b;line-height:1.4;}
  .sondage-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--gris-clair);background:#fff;border-radius:9px;padding:10px 13px;font-size:12.5px;color:#20282b;cursor:pointer;margin-bottom:8px;font-weight:700;transition:border-color .15s ease;}
  .sondage-opt:hover{border-color:var(--bleu-fonce);}
  .sondage-result{margin-bottom:11px;}
  .sondage-result-head{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;color:#20282b;margin-bottom:5px;}
  .sondage-result.mine .sondage-result-head{color:var(--bleu-fonce);}
  .sondage-bar-wrap{height:9px;background:var(--gris-fond2);border-radius:6px;overflow:hidden;}
  .sondage-bar{height:100%;background:var(--bleu-fonce);}
  .act-thanks{margin-top:14px;font-size:12px;color:#0F8A57;font-weight:700;}

  .act-nuage h2, .act-postit h2, .act-debrief h2{margin:0 0 14px;font-size:15px;color:#20282b;line-height:1.4;}
  .nuage-input-row, .postit-input-row{display:flex;gap:8px;margin-bottom:18px;}
  .nuage-input-row input, .postit-input-row input{flex:1;border:1.5px solid var(--gris-clair);border-radius:10px;padding:10px 13px;font-size:13.5px;color:#20282b;}
  .nuage-input-row input:focus, .postit-input-row input:focus{outline:none;border-color:var(--bleu);}
  .row-btn{border:none;background:var(--bleu-fonce);color:#fff;padding:0 16px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;}
  .row-btn:hover{background:#00708a;}
  .nuage-cloud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .nuage-tag{background:var(--gris-fond2);color:#20282b;border-radius:20px;padding:6px 13px;font-weight:700;}
  .nuage-tag.sm{font-size:11px;} .nuage-tag.md{font-size:13.5px;} .nuage-tag.lg{font-size:17px;}
  .nuage-tag.mine{background:var(--bleu-fonce);color:#fff;}

  .postit-list{display:flex;flex-direction:column;gap:8px;}
  .postit{background:#FDEED6;border-radius:10px;padding:10px 12px;font-size:13px;color:#20282b;}
  .postit .postit-auteur{display:block;font-size:10.5px;font-weight:800;color:var(--orange);margin-top:5px;}
  .postit.mine{background:#EAF7FB;}
  .postit.mine .postit-auteur{color:var(--bleu-fonce);}

  .roti-scale{display:flex;gap:8px;margin:4px 0 8px;}
  .roti-btn{flex:1;aspect-ratio:1;border:1.5px solid var(--gris-clair);background:#fff;border-radius:12px;font-size:16px;font-weight:800;color:#20282b;cursor:pointer;}
  .roti-btn:hover{border-color:var(--bleu-fonce);}
  .roti-btn.chosen{background:var(--bleu-fonce);border-color:var(--bleu-fonce);color:#fff;}
  .roti-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--gris-moyen);margin-bottom:18px;}

  .end-card{text-align:center;}
  .end-icon{font-size:36px;margin-bottom:12px;}
  .end-card h2{margin:0 0 10px;font-size:18px;color:#20282b;}
  .end-card p{margin:0 auto;max-width:300px;font-size:13px;color:var(--gris);}

  /* ---------- Barre de pilotage de la maquette (ne fait pas partie de l'écran participant) ---------- */
  .demo-stepper{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#20282b;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap;justify-content:center;}
  .demo-stepper-tag{background:var(--orange);color:#20282b;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.3px;padding:3px 9px;border-radius:16px;flex-shrink:0;}
  .demo-stepper button{border:none;background:rgba(255,255,255,0.12);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:12.5px;flex-shrink:0;}
  .demo-stepper button:hover{background:rgba(255,255,255,0.24);}
  .demo-stepper button:disabled{opacity:.35;cursor:default;}
  .demo-stepper button:disabled:hover{background:rgba(255,255,255,0.12);}
  .demo-stepper select{border:1.5px solid rgba(255,255,255,0.25);background:#20282b;color:#fff;border-radius:16px;padding:6px 10px;font-size:11.5px;}
  .demo-stepper .reset-btn{width:auto;border-radius:16px;padding:0 13px;font-size:11px;font-weight:700;}

  @media (max-width:480px){
    .app-wrap{margin:20px auto 20px;padding:0 12px;}
    .app-card{padding:22px 18px 24px;}
    .demo-stepper{gap:6px;padding:8px 10px;}
  }
</style>
</head>
<body>

<div class="demo-bar" id="demoBar">
  <span class="demo-tag">Maquette</span>
  <span class="demo-note">Écran participant — données factices, aucune synchronisation réelle. Objectif : valider le parcours (rejoindre, suivre, contribuer).</span>
  <a class="back-link" href="Sommaire.html">&larr; Boîte à outils</a>
</div>

<div class="app-wrap">
  <div id="appRoot"></div>
</div>

<div class="demo-stepper" id="demoStepper"></div>

<script>
/* =========================================================
   DONNÉES DE DÉMONSTRATION
   Cette maquette ne se connecte à rien : tout vit en mémoire, dans cet onglet.
   Elle simule le parcours d'un participant qui rejoint une session par lien,
   pour valider l'ergonomie avant d'investir dans une synchronisation réelle
   entre appareils. La barre du bas ne fait pas partie de l'écran participant :
   elle sert uniquement à parcourir les différents états pour la revue.
   ========================================================= */
const SESSION = {
  titre: "Prévenir les RPS dans les équipes",
  formatrice: "Gwladys Guerin — AXIS MUNDI",
  code: "482 193"
};

const DIAPO = {
  titre: "Qu'est-ce qu'un risque psychosocial ?",
  corps: "Un RPS résulte d'un déséquilibre entre les exigences d'une situation de travail et les ressources dont dispose la personne pour y faire face. Ce n'est pas un trait de caractère individuel : c'est un phénomène qui se joue dans l'organisation du travail."
};

const SONDAGE = {
  question: "Selon vous, quel est aujourd'hui le principal facteur de risque dans votre équipe ?",
  options: [
    { texte: "La charge de travail", votes: 9 },
    { texte: "Le manque de reconnaissance", votes: 6 },
    { texte: "Les tensions relationnelles", votes: 4 },
    { texte: "Le manque d'autonomie", votes: 2 }
  ]
};

const MOTS_EXISTANTS = ["surcharge","injonctions","reconnaissance","délais","isolement","pression","flou","fatigue","charge mentale"];

const POSTITS_EXISTANTS = [
  { texte: "Les objectifs qui changent sans explication", auteur: "Sofia L." },
  { texte: "Le manque de retour après les entretiens", auteur: "Karim D." },
  { texte: "La charge qui augmente sans moyens supplémentaires", auteur: "Léa F." }
];

const DEBRIEF = {
  question: "Cette séquence a-t-elle valu le temps que vous y avez consacré ?"
};

const STEPS = [
  { key:'join', label:'Écran de connexion' },
  { key:'lobby', label:"Salle d'attente" },
  { key:'diapo', label:'Diapositive (lecture seule)' },
  { key:'sondage', label:'Sondage en direct' },
  { key:'nuagemots', label:'Nuage de mots' },
  { key:'postit', label:'Post-it collaboratif' },
  { key:'debrief', label:'Débrief express (ROTI)' },
  { key:'fin', label:'Fin de session' }
];
const ACTIVITY_LABELS = {
  diapo: '📄 Diapositive',
  sondage: '🗳️ Sondage en direct',
  nuagemots: '🧠 Nuage de mots',
  postit: '🗒️ Post-it collaboratif',
  debrief: '💬 Débrief express'
};

let currentState = 'join';
let participantPrenom = '';
let sondageVoteChoisi = null;
let motsAjoutes = [];
let postitsAjoutes = [];
let debriefNoteChoisie = null;
const LOBBY_COUNT_START = 14, LOBBY_COUNT_MAX = 23;
let lobbyCount = LOBBY_COUNT_START;
let lobbyTimer = null;

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function initiale(prenom){ return (prenom || '?').trim().charAt(0).toUpperCase() || '?'; }

/* =========================================================
   RENDU PRINCIPAL
   ========================================================= */
function renderApp(){
  renderDemoStepper();
  const root = document.getElementById('appRoot');
  if(currentState === 'join'){ root.innerHTML = joinScreenHtml(); bindJoinEvents(); return; }
  if(currentState === 'lobby'){ root.innerHTML = lobbyScreenHtml(); return; }
  if(currentState === 'fin'){ root.innerHTML = finScreenHtml(); return; }
  root.innerHTML = activityShellHtml(currentState);
  bindActivityEvents(currentState);
}

/* ---------- Écran de connexion ---------- */
function joinScreenHtml(){
  return '<div class="app-card join-card">' +
    '<img class="app-logo" src="brand_assets/logo_axismundi_couleur.svg" alt="AXIS MUNDI — Développer le potentiel humain">' +
    '<h1>Rejoindre une session</h1>' +
    '<p class="join-sub">Renseignez le code communiqué par votre formatrice et votre prénom pour rejoindre l\'espace de la session en cours.</p>' +
    '<div class="field"><label>Code de session</label><input type="text" id="joinCode" value="' + escapeHtml(SESSION.code) + '"></div>' +
    '<div class="field"><label>Votre prénom</label><input type="text" id="joinPrenom" placeholder="ex. Camille" autocomplete="given-name" value="' + escapeHtml(participantPrenom) + '"></div>' +
    '<p class="join-error" id="joinError">Merci de renseigner votre prénom pour continuer.</p>' +
    '<button class="btn-join" onclick="handleJoin()">Rejoindre la session &rarr;</button>' +
    '<p class="join-note">Aucune création de compte, aucun mot de passe — l\'accès expire à la fin de la session.</p>' +
  '</div>';
}
function bindJoinEvents(){
  const input = document.getElementById('joinPrenom');
  if(input){
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') handleJoin(); });
    input.focus();
  }
}
function handleJoin(){
  const val = document.getElementById('joinPrenom').value.trim();
  const err = document.getElementById('joinError');
  if(!val){ if(err) err.style.display = 'block'; return; }
  participantPrenom = val;
  goToStep('lobby');
}

/* ---------- Salle d'attente ---------- */
function lobbyScreenHtml(){
  return '<div class="app-card lobby-card">' +
    '<div class="lobby-pulse"><span></span></div>' +
    '<h2>Vous y êtes, ' + escapeHtml(participantPrenom || 'bienvenue') + ' 👋</h2>' +
    '<p>La session « ' + escapeHtml(SESSION.titre) + ' » n\'a pas encore démarré. Cet écran se met à jour automatiquement dès que ' + escapeHtml(SESSION.formatrice.split(' — ')[0]) + ' lance la première activité.</p>' +
    '<div class="lobby-count">👥 <strong>' + lobbyCount + '</strong> participants déjà connectés</div>' +
  '</div>';
}
function startLobbyCounter(){
  clearInterval(lobbyTimer);
  lobbyTimer = setInterval(function(){
    if(currentState !== 'lobby'){ clearInterval(lobbyTimer); return; }
    if(lobbyCount < LOBBY_COUNT_MAX){ lobbyCount++; renderApp(); }
  }, 2200);
}

/* ---------- Coquille commune aux activités ---------- */
function activityShellHtml(state){
  return '<div class="app-card session-card">' +
    '<div class="app-topbar">' +
      '<div class="app-topbar-session"><strong>' + escapeHtml(SESSION.titre) + '</strong><span>' + escapeHtml(SESSION.formatrice) + '</span></div>' +
      '<div class="app-topbar-you"><span class="avatar">' + escapeHtml(initiale(participantPrenom)) + '</span>' + escapeHtml(participantPrenom || 'Vous') + '</div>' +
    '</div>' +
    '<div class="app-activity-tag">' + ACTIVITY_LABELS[state] + '</div>' +
    activityBodyHtml(state) +
  '</div>';
}
function activityBodyHtml(state){
  if(state === 'diapo') return diapoHtml();
  if(state === 'sondage') return sondageHtml();
  if(state === 'nuagemots') return nuageHtml();
  if(state === 'postit') return postitHtml();
  if(state === 'debrief') return debriefHtml();
  return '';
}
function bindActivityEvents(state){
  if(state === 'nuagemots'){
    const input = document.getElementById('motInput');
    if(input) input.addEventListener('keydown', function(e){ if(e.key === 'Enter') addMot(); });
  }
  if(state === 'postit'){
    const input = document.getElementById('postitInput');
    if(input) input.addEventListener('keydown', function(e){ if(e.key === 'Enter') addPostit(); });
  }
}

/* ---------- Diapositive (lecture seule) ---------- */
function diapoHtml(){
  return '<div class="act-diapo">' +
    '<h2>' + escapeHtml(DIAPO.titre) + '</h2>' +
    '<p>' + escapeHtml(DIAPO.corps) + '</p>' +
    '<div class="act-hint">📽️ Suivez sur l\'écran principal — rien à faire ici pour l\'instant.</div>' +
  '</div>';
}

/* ---------- Sondage en direct ---------- */
function sondageHtml(){
  const total = SONDAGE.options.reduce(function(a,o){ return a + o.votes; }, 0);
  let html = '<div class="act-sondage"><h2>' + escapeHtml(SONDAGE.question) + '</h2>';
  if(sondageVoteChoisi === null){
    html += SONDAGE.options.map(function(o, i){
      return '<button type="button" class="sondage-opt" onclick="chooseSondage(' + i + ')">' + escapeHtml(o.texte) + '</button>';
    }).join('');
  } else {
    html += SONDAGE.options.map(function(o, i){
      const pct = total ? Math.round(o.votes / total * 100) : 0;
      return '<div class="sondage-result' + (i === sondageVoteChoisi ? ' mine' : '') + '">' +
        '<div class="sondage-result-head"><span>' + escapeHtml(o.texte) + (i === sondageVoteChoisi ? ' · votre choix' : '') + '</span><span>' + pct + '%</span></div>' +
        '<div class="sondage-bar-wrap"><div class="sondage-bar" style="width:' + pct + '%;"></div></div>' +
      '</div>';
    }).join('');
    html += '<p class="act-thanks">Merci, votre réponse a été prise en compte.</p>';
  }
  html += '</div>';
  return html;
}
function chooseSondage(idx){
  if(sondageVoteChoisi !== null) return;
  SONDAGE.options[idx].votes += 1;
  sondageVoteChoisi = idx;
  renderApp();
}

/* ---------- Nuage de mots ---------- */
function nuageHtml(){
  const sizes = ['sm','md','lg'];
  const items = MOTS_EXISTANTS.map(function(m, i){ return { texte:m, taille: sizes[i % sizes.length], mine:false }; })
    .concat(motsAjoutes.map(function(m){ return { texte:m, taille:'lg', mine:true }; }));
  return '<div class="act-nuage">' +
    '<h2>Un mot pour résumer votre semaine de travail</h2>' +
    '<div class="nuage-input-row"><input type="text" id="motInput" placeholder="Votre mot…"><button class="row-btn" onclick="addMot()">Envoyer</button></div>' +
    '<div class="nuage-cloud">' + items.map(function(it){
      return '<span class="nuage-tag ' + it.taille + (it.mine ? ' mine' : '') + '">' + escapeHtml(it.texte) + '</span>';
    }).join('') + '</div>' +
  '</div>';
}
function addMot(){
  const input = document.getElementById('motInput');
  const val = input.value.trim();
  if(!val) return;
  motsAjoutes.push(val.toLowerCase());
  input.value = '';
  renderApp();
}

/* ---------- Post-it collaboratif ---------- */
function postitHtml(){
  const all = POSTITS_EXISTANTS.concat(postitsAjoutes.map(function(t){ return { texte:t, auteur:'Vous', mine:true }; }));
  return '<div class="act-postit">' +
    '<h2>Ce qui pèse le plus dans votre quotidien</h2>' +
    '<div class="postit-input-row"><input type="text" id="postitInput" placeholder="Ajouter un post-it…"><button class="row-btn" onclick="addPostit()">Ajouter</button></div>' +
    '<div class="postit-list">' + all.map(function(c){
      return '<div class="postit' + (c.mine ? ' mine' : '') + '">' + escapeHtml(c.texte) + '<span class="postit-auteur">' + escapeHtml(c.auteur) + '</span></div>';
    }).join('') + '</div>' +
  '</div>';
}
function addPostit(){
  const input = document.getElementById('postitInput');
  const val = input.value.trim();
  if(!val) return;
  postitsAjoutes.push(val);
  input.value = '';
  renderApp();
}

/* ---------- Débrief express (ROTI) ---------- */
function debriefHtml(){
  let html = '<div class="act-debrief"><h2>' + escapeHtml(DEBRIEF.question) + '</h2>' +
    '<div class="roti-scale">' + [1,2,3,4,5].map(function(n){
      return '<button type="button" class="roti-btn' + (debriefNoteChoisie === n ? ' chosen' : '') + '" onclick="chooseRoti(' + n + ')"' + (debriefNoteChoisie !== null ? ' disabled' : '') + '>' + n + '</button>';
    }).join('') + '</div>' +
    '<div class="roti-labels"><span>Pas du tout</span><span>Totalement</span></div>';
  if(debriefNoteChoisie !== null) html += '<p class="act-thanks">Merci pour votre retour.</p>';
  html += '</div>';
  return html;
}
function chooseRoti(n){
  if(debriefNoteChoisie !== null) return;
  debriefNoteChoisie = n;
  renderApp();
}

/* ---------- Fin de session ---------- */
function finScreenHtml(){
  return '<div class="app-card end-card">' +
    '<div class="end-icon">🙌</div>' +
    '<h2>Merci ' + escapeHtml(participantPrenom || '') + '</h2>' +
    '<p>La session est terminée. Vos contributions ont bien été prises en compte — vous pouvez fermer cette page.</p>' +
  '</div>';
}

/* =========================================================
   BARRE DE PILOTAGE DE LA MAQUETTE
   Ne fait pas partie de l'écran participant : sert uniquement à parcourir
   les différents états pour la revue (le vrai parcours démarre par
   l'écran de connexion et avance au fil de la session).
   ========================================================= */
function renderDemoStepper(){
  const bar = document.getElementById('demoStepper');
  const idx = STEPS.findIndex(function(s){ return s.key === currentState; });
  bar.innerHTML =
    '<span class="demo-stepper-tag">Aperçu</span>' +
    '<button type="button" onclick="stepDemo(-1)"' + (idx <= 0 ? ' disabled' : '') + '>◀</button>' +
    '<select id="demoStepSelect" onchange="goToStep(this.value)">' + STEPS.map(function(s){
      return '<option value="' + s.key + '"' + (s.key === currentState ? ' selected' : '') + '>' + escapeHtml(s.label) + '</option>';
    }).join('') + '</select>' +
    '<button type="button" onclick="stepDemo(1)"' + (idx >= STEPS.length - 1 ? ' disabled' : '') + '>▶</button>' +
    '<button type="button" class="reset-btn" onclick="resetParcours()">↺ Recommencer le parcours</button>';
}
function goToStep(key){
  currentState = key;
  if(key === 'lobby') startLobbyCounter();
  renderApp();
}
function stepDemo(delta){
  const idx = STEPS.findIndex(function(s){ return s.key === currentState; });
  const next = STEPS[Math.max(0, Math.min(STEPS.length - 1, idx + delta))];
  goToStep(next.key);
}
function resetParcours(){
  clearInterval(lobbyTimer);
  participantPrenom = '';
  sondageVoteChoisi = null;
  motsAjoutes = [];
  postitsAjoutes = [];
  debriefNoteChoisie = null;
  lobbyCount = LOBBY_COUNT_START;
  SONDAGE.options.forEach(function(o, i){ o.votes = [9,6,4,2][i]; });
  goToStep('join');
}

/* =========================================================
   INITIALISATION
   Comme pour la maquette Tables collaboratives, la barre de démonstration
   se masque automatiquement si cette page est un jour intégrée en iframe
   (par exemple depuis le Studio).
   ========================================================= */
if(window.self !== window.top){
  const bar = document.getElementById('demoBar');
  if(bar) bar.style.display = 'none';
  const stepper = document.getElementById('demoStepper');
  if(stepper) stepper.style.display = 'none';
}
renderApp();
</script>
